name: Publish Package to npm

on:
  issue_comment:
    types: [created]

permissions:
  id-token: write # Required for OIDC
  contents: write
  pull-requests: write

jobs:
  publish:
    # 仅在 PR 评论且评论内容为 /release 时触发
    if: |
      github.event.issue.pull_request &&
      github.event.comment.body == '/release' &&
      (github.event.comment.author_association == 'OWNER' || github.event.comment.author_association == 'MEMBER')
    runs-on: ubuntu-latest
    steps:
      - name: Add reaction to comment
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'eyes'
            });

      - name: Get PR branch
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });
            return {
              ref: pr.data.head.ref,
              sha: pr.data.head.sha,
              labels: pr.data.labels.map(l => l.name)
            };

      - name: Check if release PR
        run: |
          if ! echo '${{ steps.pr.outputs.result }}' | jq -e '.labels | contains(["release"])' > /dev/null; then
            echo "This PR is not labeled as a release"
            exit 1
          fi

      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ fromJson(steps.pr.outputs.result).ref }}
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
          cache: "pnpm"

      - name: Update npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: pnpm install

      - name: Build package
        run: pnpm build

      - name: Publish to npm
        run: npm publish --access public

      - name: Get version from package.json
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Published version: $VERSION"

      - name: Get changelog entry
        id: changelog
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          CHANGELOG_ENTRY=$(sed -n "/## \[$VERSION\]/,/^## \[/p" CHANGELOG.md | sed '1d;$d')

          echo "Changelog for version $VERSION:"
          echo "$CHANGELOG_ENTRY"

          {
            echo "changelog<<EOF"
            echo "$CHANGELOG_ENTRY"
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Merge PR
        uses: actions/github-script@v7
        with:
          script: |
            const result = await github.rest.pulls.merge({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              merge_method: 'squash'
            });
            return result.data.sha;

      - name: Create GitHub Release
        uses: actions/github-script@v7
        with:
          script: |
            const version = '${{ steps.version.outputs.version }}';
            const changelog = `${{ steps.changelog.outputs.changelog }}`;

            await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: `v${version}`,
              name: `v${version}`,
              body: changelog || 'No changelog available',
              draft: false,
              prerelease: false
            });

      - name: Comment success
        uses: actions/github-script@v7
        with:
          script: |
            const version = '${{ steps.version.outputs.version }}';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `✅ Release v${version} published successfully!\n\n- 📦 [npm package](https://www.npmjs.com/package/@quentinhsu/biome-config/v/${version})\n- 🎉 [GitHub Release](https://github.com/${context.repo.owner}/${context.repo.repo}/releases/tag/v${version})\n- ✓ PR merged to main`
            });

            // Add success reaction
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'rocket'
            });

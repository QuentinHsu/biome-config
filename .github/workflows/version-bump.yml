name: Version Bump and Changelog

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  pull-requests: write

jobs:
  version-bump:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Extract version from tag
        id: extract_version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Extracted version: $VERSION"

      - name: Update package.json version
        run: |
          npm version ${{ steps.extract_version.outputs.version }} --no-git-tag-version

      - name: Get previous tag
        id: previous_tag
        run: |
          # Get the tag before the current one
          CURRENT_TAG="v${{ steps.extract_version.outputs.version }}"
          PREVIOUS_TAG=$(git tag --sort=-version:refname | grep -A 1 "^${CURRENT_TAG}$" | tail -1)

          if [ -z "$PREVIOUS_TAG" ] || [ "$PREVIOUS_TAG" = "$CURRENT_TAG" ]; then
            # If no previous tag, use the first commit
            PREVIOUS_TAG=$(git rev-list --max-parents=0 HEAD)
            echo "No previous tag found, using first commit: $PREVIOUS_TAG"
          else
            echo "Previous tag: $PREVIOUS_TAG"
          fi

          echo "tag=$PREVIOUS_TAG" >> $GITHUB_OUTPUT

      - name: Generate CHANGELOG
        run: |
          # Generate changelog from previous tag to current HEAD
          pnpm run generate:changelog ${{ steps.previous_tag.outputs.tag }} HEAD

      - name: Get changelog entry
        id: changelog
        run: |
          VERSION="${{ steps.extract_version.outputs.version }}"
          # Extract changelog content for the specific version
          # Find content between ## [VERSION] and next ## [ line, excluding the header and next section
          CHANGELOG_ENTRY=$(sed -n "/## \[$VERSION\]/,/^## \[/p" CHANGELOG.md | sed '1d;$d')

          # Debug: Show what we extracted
          echo "Extracted changelog for version $VERSION:"
          echo "$CHANGELOG_ENTRY"

          # Save to output
          {
            echo "changelog<<EOF"
            echo "$CHANGELOG_ENTRY"
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: bump version to ${{ steps.extract_version.outputs.version }}"
          branch: release/v${{ steps.extract_version.outputs.version }}
          base: main
          title: "Release v${{ steps.extract_version.outputs.version }}"
          body: |
            ## Release v${{ steps.extract_version.outputs.version }}

            This PR updates the package version and changelog for the new release.

            ### Changelog

            ${{ steps.changelog.outputs.changelog }}

            ---

            **Commands:**
            - Comment `/release` to publish this release to npm
            - Comment `/regenerate-changelog` to regenerate the changelog
          labels: release
          delete-branch: true
